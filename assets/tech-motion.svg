<svg width="1000" height="250" viewBox="0 0 1000 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F79A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: white; }
      .subtitle { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #93c5fd; letter-spacing: 2px; }
      .chipText { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #E2E8F0; }
      .chipSub { font: 600 10px 'Segoe UI', Arial, sans-serif; fill: #7DD3FC; letter-spacing: 1.1px; }
      .tiny { font: 600 10px 'Segoe UI', Arial, sans-serif; fill: #A5F3FC; letter-spacing: 2px; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="248" rx="28" fill="url(#bg)" stroke="url(#stroke)" stroke-opacity="0.5"/>
  <circle cx="90" cy="50" r="2" fill="#38BDF8" filter="url(#glow)">
    <animate attributeName="cy" values="50;62;50" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="920" cy="40" r="2.5" fill="#00F79A" filter="url(#glow)">
    <animate attributeName="cy" values="40;54;40" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="200" r="2" fill="#38BDF8" filter="url(#glow)">
    <animate attributeName="cy" values="200;184;200" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="38" text-anchor="middle" class="title">Interactive Tech Motion</text>
  <text x="500" y="58" text-anchor="middle" class="subtitle">PREMIUM DESIGN • ENGINEERING STACK • SUBTLE ANIMATION</text>

  <g transform="translate(50 90)">
    <animateTransform attributeName="transform" type="translate" values="50 90;58 84;50 90" dur="5.5s" repeatCount="indefinite"/>
    <rect width="140" height="56" rx="18" fill="url(#chip)" stroke="#38BDF8" stroke-opacity="0.8"/>
    <text x="20" y="25" class="chipText">HTML5</text>
    <text x="20" y="42" class="chipSub">MARKUP</text>
  </g>

  <g transform="translate(210 118)">
    <animateTransform attributeName="transform" type="translate" values="210 118;200 124;210 118" dur="4.8s" repeatCount="indefinite"/>
    <rect width="140" height="56" rx="18" fill="url(#chip)" stroke="#60A5FA" stroke-opacity="0.7"/>
    <text x="20" y="25" class="chipText">CSS3</text>
    <text x="20" y="42" class="chipSub">STYLING</text>
  </g>

  <g transform="translate(370 92)">
    <animateTransform attributeName="transform" type="translate" values="370 92;380 86;370 92" dur="6.2s" repeatCount="indefinite"/>
    <rect width="150" height="56" rx="18" fill="url(#chip)" stroke="#FACC15" stroke-opacity="0.9"/>
    <text x="20" y="25" class="chipText">JavaScript</text>
    <text x="20" y="42" class="chipSub">LOGIC</text>
  </g>

  <g transform="translate(540 120)">
    <animateTransform attributeName="transform" type="translate" values="540 120;532 112;540 120" dur="5.1s" repeatCount="indefinite"/>
    <rect width="150" height="56" rx="18" fill="url(#chip)" stroke="#2563EB" stroke-opacity="0.8"/>
    <text x="20" y="25" class="chipText">TypeScript</text>
    <text x="20" y="42" class="chipSub">TYPE SAFE</text>
  </g>

  <g transform="translate(710 92)">
    <animateTransform attributeName="transform" type="translate" values="710 92;718 100;710 92" dur="5.8s" repeatCount="indefinite"/>
    <rect width="120" height="56" rx="18" fill="url(#chip)" stroke="#61DAFB" stroke-opacity="0.9"/>
    <text x="20" y="25" class="chipText">React</text>
    <text x="20" y="42" class="chipSub">UI</text>
  </g>

  <g transform="translate(845 118)">
    <animateTransform attributeName="transform" type="translate" values="845 118;837 124;845 118" dur="4.4s" repeatCount="indefinite"/>
    <rect width="110" height="56" rx="18" fill="url(#chip)" stroke="#FFFFFF" stroke-opacity="0.65"/>
    <text x="20" y="25" class="chipText">Next.js</text>
    <text x="20" y="42" class="chipSub">APP</text>
  </g>

  <g transform="translate(95 180)">
    <animateTransform attributeName="transform" type="translate" values="95 180;103 172;95 180" dur="4.6s" repeatCount="indefinite"/>
    <rect width="130" height="42" rx="14" fill="url(#chip)" stroke="#22C55E" stroke-opacity="0.85"/>
    <text x="18" y="26" class="chipText" style="font-size:15px;">Node.js</text>
  </g>

  <g transform="translate(245 184)">
    <animateTransform attributeName="transform" type="translate" values="245 184;238 176;245 184" dur="5.9s" repeatCount="indefinite"/>
    <rect width="110" height="42" rx="14" fill="url(#chip)" stroke="#A78BFA" stroke-opacity="0.75"/>
    <text x="18" y="26" class="chipText" style="font-size:15px;">PHP</text>
  </g>

  <g transform="translate(370 182)">
    <animateTransform attributeName="transform" type="translate" values="370 182;378 188;370 182" dur="5.2s" repeatCount="indefinite"/>
    <rect width="110" height="42" rx="14" fill="url(#chip)" stroke="#FB923C" stroke-opacity="0.8"/>
    <text x="18" y="26" class="chipText" style="font-size:15px;">Java</text>
  </g>

  <g transform="translate(495 182)">
    <animateTransform attributeName="transform" type="translate" values="495 182;503 174;495 182" dur="6.4s" repeatCount="indefinite"/>
    <rect width="130" height="42" rx="14" fill="url(#chip)" stroke="#10B981" stroke-opacity="0.75"/>
    <text x="18" y="26" class="chipText" style="font-size:15px;">MongoDB</text>
  </g>

  <g transform="translate(642 184)">
    <animateTransform attributeName="transform" type="translate" values="642 184;635 176;642 184" dur="5.4s" repeatCount="indefinite"/>
    <rect width="120" height="42" rx="14" fill="url(#chip)" stroke="#60A5FA" stroke-opacity="0.75"/>
    <text x="18" y="26" class="chipText" style="font-size:15px;">MySQL</text>
  </g>

  <g transform="translate(777 182)">
    <animateTransform attributeName="transform" type="translate" values="777 182;785 190;777 182" dur="4.9s" repeatCount="indefinite"/>
    <rect width="145" height="42" rx="14" fill="url(#chip)" stroke="#38BDF8" stroke-opacity="0.75"/>
    <text x="18" y="26" class="chipText" style="font-size:15px;">PostgreSQL</text>
  </g>

  <text x="38" y="236" class="tiny">LIVE STACK VISUAL</text>
  <text x="962" y="236" text-anchor="end" class="tiny">ALAMYAR</text>
</svg>
