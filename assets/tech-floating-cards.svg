<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.45" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#00F79A"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#121A2B"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="glowGreen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#00F79A"/>
    </linearGradient>
    <linearGradient id="glowPurple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glowOrange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#FFFFFF;letter-spacing:.5px}
      .sub{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#7DD3FC;letter-spacing:2.8px}
      .cardTitle{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#FFFFFF}
      .label{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#93C5FD;letter-spacing:1.6px}
      .tech{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#E5EEF9}
      .tiny{font:600 11px 'Segoe UI',Arial,sans-serif;fill:#9BDCFB;letter-spacing:2.2px}
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="1197" height="427" rx="30" fill="url(#bg)" stroke="url(#border)" stroke-opacity="0.5" stroke-width="3"/>

  <text x="600" y="42" text-anchor="middle" class="title">Floating 3D Tech Stack</text>
  <text x="600" y="65" text-anchor="middle" class="sub">PREMIUM • INTERACTIVE • GITHUB FRIENDLY</text>

  <!-- ambient particles -->
  <circle cx="74" cy="72" r="3" fill="#38BDF8" opacity="0.85" filter="url(#softGlow)">
    <animate attributeName="cy" values="72;58;72" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="82" r="3" fill="#00F79A" opacity="0.9" filter="url(#softGlow)">
    <animate attributeName="cy" values="82;96;82" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1035" cy="348" r="2.5" fill="#A78BFA" opacity="0.9" filter="url(#softGlow)">
    <animate attributeName="cy" values="348;332;348" dur="6.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="135" cy="364" r="2.5" fill="#FB923C" opacity="0.8" filter="url(#softGlow)">
    <animate attributeName="cy" values="364;378;364" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <!-- FRONTEND CARD -->
  <g filter="url(#shadow)">
    <g transform="translate(85 110)">
      <animateTransform attributeName="transform" type="translate" values="85 110;85 96;85 110" dur="5.6s" repeatCount="indefinite"/>
      <rect width="225" height="220" rx="26" fill="url(#cardA)" stroke="url(#glowBlue)" stroke-width="2.4"/>
      <rect x="18" y="18" width="58" height="58" rx="16" fill="#0D2237" stroke="#38BDF8" stroke-opacity="0.8"/>
      <circle cx="47" cy="47" r="13" stroke="#38BDF8" stroke-width="3" fill="none"/>
      <circle cx="47" cy="47" r="4" fill="#38BDF8"/>
      <path d="M47 30 L47 18 M62 39 L73 34 M62 55 L73 60 M47 64 L47 76 M32 55 L21 60 M32 39 L21 34" stroke="#7DD3FC" stroke-width="2.3" stroke-linecap="round"/>
      <text x="92" y="43" class="cardTitle">Frontend</text>
      <text x="92" y="63" class="label">USER EXPERIENCE LAYER</text>
      <text x="25" y="105" class="tech">• HTML5</text>
      <text x="25" y="132" class="tech">• CSS3</text>
      <text x="25" y="159" class="tech">• JavaScript</text>
      <text x="25" y="186" class="tech">• TypeScript</text>
      <text x="125" y="105" class="tech">• React</text>
      <text x="125" y="132" class="tech">• Next.js</text>
      <text x="125" y="159" class="tech">• Tailwind</text>
      <text x="125" y="186" class="tech">• UI Systems</text>
      <rect x="22" y="198" width="180" height="8" rx="4" fill="#0B2440"/>
      <rect x="22" y="198" width="140" height="8" rx="4" fill="url(#glowBlue)">
        <animate attributeName="width" values="124;150;124" dur="3.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- BACKEND CARD -->
  <g filter="url(#shadow)">
    <g transform="translate(345 136)">
      <animateTransform attributeName="transform" type="translate" values="345 136;345 150;345 136" dur="6.2s" repeatCount="indefinite"/>
      <rect width="240" height="220" rx="26" fill="url(#cardA)" stroke="url(#glowGreen)" stroke-width="2.4"/>
      <rect x="18" y="18" width="58" height="58" rx="16" fill="#0E261C" stroke="#00F79A" stroke-opacity="0.85"/>
      <path d="M36 39 H59 M36 55 H59 M30 32 H65 V62 H30 Z" stroke="#00F79A" stroke-width="2.4" fill="none"/>
      <circle cx="33" cy="39" r="3" fill="#00F79A"/>
      <circle cx="62" cy="55" r="3" fill="#00F79A"/>
      <text x="92" y="43" class="cardTitle">Backend</text>
      <text x="92" y="63" class="label">APPLICATION & API LOGIC</text>
      <text x="25" y="105" class="tech">• Node.js</text>
      <text x="25" y="132" class="tech">• PHP</text>
      <text x="25" y="159" class="tech">• Java</text>
      <text x="25" y="186" class="tech">• REST API</text>
      <text x="135" y="105" class="tech">• Auth Flow</text>
      <text x="135" y="132" class="tech">• Services</text>
      <text x="135" y="159" class="tech">• Business Logic</text>
      <text x="135" y="186" class="tech">• Clean Structure</text>
      <rect x="22" y="198" width="190" height="8" rx="4" fill="#0E2F27"/>
      <rect x="22" y="198" width="154" height="8" rx="4" fill="url(#glowGreen)">
        <animate attributeName="width" values="138;170;138" dur="4.3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- DATABASE CARD -->
  <g filter="url(#shadow)">
    <g transform="translate(636 102)">
      <animateTransform attributeName="transform" type="translate" values="636 102;636 88;636 102" dur="5.2s" repeatCount="indefinite"/>
      <rect width="235" height="220" rx="26" fill="url(#cardA)" stroke="url(#glowPurple)" stroke-width="2.4"/>
      <rect x="18" y="18" width="58" height="58" rx="16" fill="#201538" stroke="#A78BFA" stroke-opacity="0.85"/>
      <ellipse cx="47" cy="34" rx="16" ry="7" stroke="#A78BFA" stroke-width="2.4" fill="none"/>
      <path d="M31 34V56C31 60 38 63 47 63C56 63 63 60 63 56V34" stroke="#A78BFA" stroke-width="2.4" fill="none"/>
      <ellipse cx="47" cy="56" rx="16" ry="7" stroke="#A78BFA" stroke-width="2.4" fill="none"/>
      <text x="92" y="43" class="cardTitle">Database</text>
      <text x="92" y="63" class="label">DATA MODEL & REPORTING</text>
      <text x="25" y="105" class="tech">• MongoDB</text>
      <text x="25" y="132" class="tech">• MySQL</text>
      <text x="25" y="159" class="tech">• PostgreSQL</text>
      <text x="25" y="186" class="tech">• SQL Design</text>
      <text x="140" y="105" class="tech">• Queries</text>
      <text x="140" y="132" class="tech">• Optimization</text>
      <text x="140" y="159" class="tech">• Validation</text>
      <text x="140" y="186" class="tech">• Reports</text>
      <rect x="22" y="198" width="188" height="8" rx="4" fill="#291E4D"/>
      <rect x="22" y="198" width="146" height="8" rx="4" fill="url(#glowPurple)">
        <animate attributeName="width" values="132;168;132" dur="3.7s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- TOOLS CARD -->
  <g filter="url(#shadow)">
    <g transform="translate(904 140)">
      <animateTransform attributeName="transform" type="translate" values="904 140;904 152;904 140" dur="6.8s" repeatCount="indefinite"/>
      <rect width="205" height="205" rx="26" fill="url(#cardA)" stroke="url(#glowOrange)" stroke-width="2.4"/>
      <rect x="18" y="18" width="54" height="54" rx="16" fill="#34230D" stroke="#FB923C" stroke-opacity="0.85"/>
      <path d="M45 30 L57 42 L46 53 L34 41 Z" stroke="#FB923C" stroke-width="2.4" fill="none"/>
      <circle cx="46" cy="42" r="3" fill="#FB923C"/>
      <text x="84" y="43" class="cardTitle">Tools</text>
      <text x="84" y="63" class="label">DELIVERY STACK</text>
      <text x="25" y="103" class="tech">• Git</text>
      <text x="25" y="130" class="tech">• GitHub</text>
      <text x="25" y="157" class="tech">• VS Code</text>
      <text x="25" y="184" class="tech">• Vite</text>
      <text x="105" y="103" class="tech">• Motion</text>
      <text x="105" y="130" class="tech">• Deploy</text>
      <text x="105" y="157" class="tech">• Workflow</text>
      <text x="105" y="184" class="tech">• Delivery</text>
    </g>
  </g>

  <text x="40" y="396" class="tiny">FLOATING CARDS • SUBTLE DEPTH • MODERN ENGINEERING</text>
  <text x="1160" y="396" text-anchor="end" class="tiny">ALAMYAR</text>
</svg>
